name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    name: Supported tests, lint and installed smoke
    uses: ./.github/workflows/ci.yml

  build:
    name: Verify one artifact batch
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check source and optional tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        shell: python
        run: |
          import os
          import subprocess
          import sys
          args = [sys.executable, "scripts/check_release.py"]
          if os.environ["RELEASE_TAG"]:
              args.extend(["--tag", os.environ["RELEASE_TAG"]])
          subprocess.run(args, check=True)
      - run: uv build --out-dir release-dist
      - name: Check metadata and generate SHA-256 manifest
        run: python scripts/check_release.py --dist release-dist > release-dist/SHA256SUMS
      - run: uv venv .venv-release
      - name: Install the exact release wheel
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          wheel, = Path("release-dist").glob("*.whl")
          subprocess.run(["uv", "pip", "install", "--python", ".venv-release", str(wheel)], check=True)
      - name: Verify installed release outside checkout
        run: .venv-release/bin/python tests/smoke_installed.py
      - uses: actions/upload-artifact@v7
        with:
          name: repoize-release-${{ github.sha }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: repoize-release-${{ github.sha }}
          path: release-dist
      - name: Verify downloaded bytes
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-dist/*.whl
            release-dist/*.tar.gz
            release-dist/SHA256SUMS
