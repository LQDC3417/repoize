name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv pip install --system ruff
      - run: ruff check src/ tests/ scripts/
      - run: ruff format --check src/ tests/ scripts/

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install --system -e ".[dev]"
      - run: python -m pytest tests/ -v --tb=short
      - run: uv build --wheel
      - run: uv venv .venv-smoke
      - name: Install built wheel in isolated environment
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          wheel, = Path("dist").glob("*.whl")
          subprocess.run(["uv", "pip", "install", "--python", ".venv-smoke", str(wheel)], check=True)
      - name: Verify installed CLI and package resources
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import Path
          executable = "Scripts/python.exe" if os.name == "nt" else "bin/python"
          python = Path(".venv-smoke") / executable
          subprocess.run([str(python), "tests/smoke_installed.py"], check=True)
