[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoize"
version = "0.3.0"
description = "Generate evidence-based project instructions for AI coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "repoize contributors" },
]
keywords = ["ai", "agent", "cli", "developer-tools", "mcp", "claude-code", "cursor", "copilot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "jsonschema>=4.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.11",
]

[project.scripts]
repoize = "repoize.cli:main"

[project.urls]
Homepage = "https://github.com/LQDC3417/repoize"
Repository = "https://github.com/LQDC3417/repoize"
Issues = "https://github.com/LQDC3417/repoize/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repoize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # 行过长（由 formatter 处理）
]

[tool.ruff.lint.isort]
known-first-party = ["repoize"]
